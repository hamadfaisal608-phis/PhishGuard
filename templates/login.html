{% extends "base.html" %}
{% block title %}Login - PhishGuard{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card box">
            <div class="card-body p-4">
                <h4 class="mb-3">Login</h4>
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-green w-100">Login</button>
                </form>
                <p class="mt-3 mb-1 small">No account? <a href="{{ url_for('signup') }}">Sign up</a></p>
                <p class="mb-0 small"><a href="{{ url_for('dashboard') }}">Continue as guest</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
