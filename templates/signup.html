{% extends "base.html" %}
{% block title %}Sign up - PhishGuard{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card box">
            <div class="card-body p-4">
                <h4 class="mb-3">Create account</h4>
                <form method="POST" action="{{ url_for('signup') }}">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control" minlength="3" maxlength="30" required autofocus>
                        <div class="form-text">Letters, numbers, dot and underscore only.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" minlength="6" required>
                        <div class="form-text">At least 6 characters.</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirm" class="form-label">Confirm password</label>
                        <input type="password" id="confirm" name="confirm" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-green w-100">Sign up</button>
                </form>
                <p class="mt-3 mb-0 small">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
